name: Release

on:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'server.js'
      - 'config/**'
      - 'core/**'
      - 'engine/**'
      - 'providers/**'
      - 'routes/**'
      - 'surfaces/**'
      - 'utils/**'
      - 'openapi.json'
      - 'scripts/build.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'zerokey.sh'
      - 'zerokey.bat'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Resolve esbuild version
        id: esb
        run: echo "v=$(node -p "require('./package.json').devDependencies.esbuild.replace(/^[^0-9]*/, '')")" >> "$GITHUB_OUTPUT"
      - name: Cache npm (esbuild)
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: esbuild-${{ steps.esb.outputs.v }}
      - name: Install esbuild
        run: npm i --prefix .. esbuild@${{ steps.esb.outputs.v }}
      - name: Build dist
        run: node scripts/build.mjs
      - name: Smoke test dist
        run: |
          for f in server.js package.json version.txt pnpm-lock.yaml pnpm-workspace.yaml; do
            test -s "dist/$f" || { echo "missing dist/$f"; exit 1; }
          done
          node --check dist/server.js
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          (cd dist && sha256sum server.js package.json version.txt pnpm-lock.yaml pnpm-workspace.yaml > SHA256SUMS)
          VERSION=$(cat dist/version.txt)
          gh release create "v${VERSION/+/-}" dist/* zerokey.bat zerokey.sh \
            --title "v${VERSION}" \
            --generate-notes \
            --latest
